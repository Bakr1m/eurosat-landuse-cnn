[project]
name = "eurosat-landuse-cnn"
version = "1.0.0"
description = "Custom CNN for 10-class EuroSAT land-use/land-cover classification (Sentinel-2 RGB): 0.9123 test accuracy, FastAPI, Docker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
